# LittleHorse dashboard (lh-standalone) uses 8080
quarkus.http.port=8081

lhc.api.host=localhost
lhc.api.port=2023
lhw.task.worker.id=jev-demo-worker

quarkus.rest-client.typesafe.url=https://api.typesafe.ai
quarkus.rest-client.typesafe.read-timeout=30000
typesafe.api-key=${TYPESAFE_API_KEY}
typesafe.model=jev-latest

quarkus.rest-client.openai.url=https://api.openai.com
quarkus.rest-client.openai.read-timeout=30000
openai.api-key=${OPENAI_API_KEY}
openai.model=gpt-5.6-luna
openai.reasoning-effort=low

# Outside services, all served by this app
quarkus.rest-client.carrier.url=http://localhost:${quarkus.http.port}
quarkus.rest-client.crm.url=http://localhost:${quarkus.http.port}
quarkus.rest-client.ats.url=http://localhost:${quarkus.http.port}
quarkus.rest-client.verify.url=http://localhost:${quarkus.http.port}
quarkus.rest-client.helpdesk.url=http://localhost:${quarkus.http.port}
quarkus.rest-client.recruiting.url=http://localhost:${quarkus.http.port}
